---
# Minecraft AI Civilization - 10 Bot Deployment
# All bots run in a single pod for efficient resource sharing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindcraft-civilization
  namespace: minecraft-ai
  labels:
    app: mindcraft-civilization
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindcraft-civilization
  template:
    metadata:
      labels:
        app: mindcraft-civilization
    spec:
      containers:
      - name: mindcraft-civilization
        image: ocholoko888/mindcraft-andy:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: mindserver
        - containerPort: 3000
          name: viewer-1
        - containerPort: 3001
          name: viewer-2
        - containerPort: 3002
          name: viewer-3
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: mindcraft-secrets
              key: GEMINI_API_KEY
        - name: QDRANT_HOST
          value: "qdrant"
        - name: QDRANT_PORT
          value: "6333"
        - name: REDIS_HOST
          value: "redis-master"
        - name: REDIS_PORT
          value: "6379"
        - name: MONGO_HOST
          value: "mongodb"
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_USER
          value: "mindcraft"
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mindcraft-secrets
              key: MONGO_PASSWORD
              optional: true
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "3"
            memory: 4Gi
        volumeMounts:
        - name: bot-memories
          mountPath: /app/bots
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: bot-memories
        persistentVolumeClaim:
          claimName: bot-memory-pvc
---
# Service for MindServer UI
apiVersion: v1
kind: Service
metadata:
  name: mindcraft-civilization
  namespace: minecraft-ai
spec:
  type: NodePort
  selector:
    app: mindcraft-civilization
  ports:
  - name: mindserver
    port: 8080
    targetPort: 8080
    nodePort: 30580
